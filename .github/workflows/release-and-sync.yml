name: Release & Sync

on:
  push:
    branches:
      - main # Releases only happen when code is merged into main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          target-branch: main

  back-merge:
    name: Automate Back-Merge
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Create Back-Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after release" \
            --body "🤖 **Automated PR:** This syncs the updated \`package.json\` and \`CHANGELOG.md\` from \`main\` back to \`dev\` after a release. Please merge this immediately to prevent future merge conflicts."
